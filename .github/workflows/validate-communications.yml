name: Validate communications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run deterministic communications validation
        shell: bash
        run: |
          node scripts/validate-communications.mjs --branch "${{ github.head_ref || github.ref_name }}"
          node --test tests/*.test.mjs
