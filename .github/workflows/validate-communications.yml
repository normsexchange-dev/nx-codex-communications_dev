name: Validate communications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NX_COMMUNICATIONS_BRANCH: ${{ github.head_ref || github.ref_name }}
      NX_COMMUNICATIONS_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic communications validation
        shell: bash
        run: |
          if [[ -f destination-core.json ]]; then
            node scripts/validate-destination.mjs --root . --repository "$NX_COMMUNICATIONS_REPOSITORY"
          else
            node scripts/validate-communications.mjs --branch "$NX_COMMUNICATIONS_BRANCH"
            node scripts/test-communications.mjs
          fi
