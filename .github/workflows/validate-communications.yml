name: Validate communications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NX_COMMUNICATIONS_BRANCH: ${{ github.head_ref || github.ref_name }}
      NX_COMMUNICATIONS_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic communications validation
        run: node scripts/validate-communications.mjs --branch "$NX_COMMUNICATIONS_BRANCH"
